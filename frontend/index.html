
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123456">
  <title>Voice Field Register</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <main class="container">
    <h1>Voice Field Register</h1>
    <p>AI-powered field visit assistant</p>

    <label for="language">Choose Language</label>
    <select id="language">
      <option value="en">English</option>
      <option value="hi">Hindi</option>
    </select>

    <p id="status">Ready to connect</p>

    <button id="startBtn">Start Recording</button>
    <button id="stopBtn" disabled>Stop Recording</button>

    <section>
      <h2>Transcript</h2>
      <p id="transcript">Your conversation will appear here.</p>
    </section>

    <section>
      <h2>Visit Details</h2>
      <div id="visitDetails">No details received yet.</div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
