<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#123b35">
    <title>Gnani Voice Field Register</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="app">
        <header>
            <h1>Gnani Voice Field Register</h1>
            <p>AI-powered voice assistance for field visits</p>
        </header>

        <section class="panel">
            <label for="language">Choose language</label>
            <select id="language">
                <option value="en">English</option>
                <option value="hi">Hindi</option>
            </select>

            <button id="connectBtn">Connect</button>
            <button id="micBtn" disabled>Start speaking</button>
            <button id="stopBtn" disabled>Stop</button>

            <p id="status">Not connected</p>
        </section>

        <section class="panel">
            <h2>Conversation</h2>
            <div id="conversation" aria-live="polite">
                <p>Your conversation will appear here.</p>
            </div>
        </section>

        <section class="panel">
            <h2>Visit details</h2>
            <pre id="visitDetails">No visit details yet.</pre>
            <p id="dangerStatus">No safety alert.</p>
        </section>
    </main>

    <script src="/app.js"></script>
</body>
</html>
